apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Chart.Name }}-{{ .Release.Name }}-cluster-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  {{- range $user := .Values.clusterAdminUsers }}
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user }}
  {{- end }}
  {{- range $group := .Values.clusterAdminGroups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $group }}
  {{- end }}
